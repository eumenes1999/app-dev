<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100 Days Habit Tracker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f2027">
    <script>
        (function () {
            var saved = localStorage.getItem('100days_theme');
            if (saved === 'light' || saved === 'dark') {
                document.documentElement.dataset.theme = saved;
            }
        })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="init-error" class="init-error" hidden></div>
    <div id="toast" class="toast" hidden></div>

    <div class="app-container" id="app-container" hidden>
        <header>
            <div class="hero-icon">🔥</div>
            <p class="hero-eyebrow">100 Days Challenge</p>
            <h1 id="hero-headline">続けることが、いちばんの力になる。</h1>
            <p class="hero-sub" id="hero-subtext">今日という1日を積み重ねて、100日後の自分をつくる。</p>

            <!-- 目標追加フォーム -->
            <div class="add-goal-container">
                <input type="text" id="goal-input" placeholder="新しい目標を入力 (例: 読書を15分する)" maxlength="30">
                <button id="add-goal-btn">追加</button>
            </div>
            <div class="goal-limit-text">※ 目標は最大10個まで登録できます (<span id="goal-count-display">0</span>/10)</div>
        </header>

        <div class="view-tabs">
            <button id="tab-habits-btn" class="view-tab active" type="button">習慣</button>
            <button id="tab-memos-btn" class="view-tab" type="button">メモ</button>
            <button id="tab-settings-btn" class="view-tab view-tab-icon" type="button" aria-label="設定">⚙️</button>
        </div>

        <main id="habits-view">
            <div id="goals-container" class="goals-container">
                <!-- JavaScriptで目標カードが生成されます -->
            </div>
        </main>

        <main id="memos-view" hidden>
            <div class="memo-habit-select">
                <label for="memo-habit-select">習慣を選択</label>
                <select id="memo-habit-select">
                    <option value="__all__">すべて（閲覧のみ）</option>
                </select>
            </div>

            <section id="memo-week-section" class="memo-week">
                <h2>今週のメモ（直近7日・編集できます）</h2>
                <div id="memo-week-list" class="memo-week-list"></div>
            </section>

            <section class="memo-archive">
                <h2 id="memo-archive-title">過去のメモ</h2>
                <div id="memo-archive-list" class="memo-archive-list"></div>
                <p id="memo-empty" class="empty-note" hidden>まだメモがありません。</p>
            </section>
        </main>

        <main id="settings-view" hidden>
            <section class="settings-section">
                <h2>トップページの文言</h2>
                <div class="settings-field">
                    <label for="headline-input">見出し</label>
                    <input type="text" id="headline-input" maxlength="24" placeholder="続けることが、いちばんの力になる。">
                </div>
                <div class="settings-field">
                    <label for="subtext-input">補足文</label>
                    <input type="text" id="subtext-input" maxlength="36" placeholder="今日という1日を積み重ねて、100日後の自分をつくる。">
                </div>
            </section>

            <section class="settings-section">
                <h2>背景画像</h2>
                <div class="settings-row">
                    <label for="bg-upload" class="bg-upload-label">
                        📷 画像を選択
                    </label>
                    <input type="file" id="bg-upload" accept="image/*" style="display: none;">
                    <button id="reset-bg-btn" class="settings-btn" type="button">デフォルトに戻す</button>
                </div>
            </section>

            <section class="settings-section">
                <h2>テーマ</h2>
                <div class="settings-row">
                    <button id="theme-toggle-btn" class="settings-btn" type="button">🌙 ダーク</button>
                </div>
            </section>

            <section class="settings-section settings-section-danger">
                <h2>データ</h2>
                <div class="settings-row">
                    <button id="reset-all-btn" class="settings-btn settings-btn-danger" type="button">全データリセット</button>
                </div>
            </section>
        </main>
    </div>

    <!-- 紙吹雪アニメーション用のライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
