<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>100 Days Habit Tracker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f2027">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <h1>100 Days Challenge</h1>
            <p class="auth-sub">続けるにはログインしてください</p>
            <form id="auth-form" class="auth-form">
                <div class="form-row">
                    <label for="auth-email">メールアドレス</label>
                    <input type="email" id="auth-email" required autocomplete="username">
                </div>
                <div class="form-row">
                    <label for="auth-password">パスワード</label>
                    <input type="password" id="auth-password" required autocomplete="current-password" minlength="6">
                </div>
                <p id="auth-error" class="auth-error" hidden></p>
                <p id="auth-notice" class="auth-notice" hidden></p>
                <div class="auth-actions">
                    <button type="submit" id="auth-login-btn">ログイン</button>
                    <button type="button" id="auth-signup-btn" class="auth-signup-btn">新規登録</button>
                </div>
            </form>
        </div>
    </div>

    <div class="app-container" id="app-container" hidden>
        <header>
            <h1>100 Days Challenge</h1>

            <div class="user-bar">
                <span id="user-email" class="user-email"></span>
                <button id="logout-btn" class="logout-btn">ログアウト</button>
            </div>

            <div class="bg-control">
                <label for="bg-upload" class="bg-upload-label">
                    📷 背景画像を選択
                </label>
                <input type="file" id="bg-upload" accept="image/*" style="display: none;">
            </div>

            <!-- 目標追加フォーム -->
            <div class="add-goal-container">
                <input type="text" id="goal-input" placeholder="新しい目標を入力 (例: 読書を15分する)" maxlength="30">
                <button id="add-goal-btn">追加</button>
            </div>
            <div class="goal-limit-text">※ 目標は最大10個まで登録できます (<span id="goal-count-display">0</span>/10)</div>
            
            <button id="reset-all-btn" class="reset-btn">全データリセット</button>
        </header>

        <main>
            <div id="goals-container" class="goals-container">
                <!-- JavaScriptで目標カードが生成されます -->
            </div>
        </main>
    </div>

    <!-- 紙吹雪アニメーション用のライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
