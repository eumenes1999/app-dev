<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULT-TEC APPROVED READING // SURVIVAL GUIDE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="magazine.css">
</head>
<body>

<div class="stage">
  <article class="cover">

    <div class="paper-grain"></div>
    <div class="paper-stains"></div>

    <!-- 値札シール -->
    <div class="price-tag"><span>99¢</span></div>

    <!-- 上部帯 -->
    <header class="masthead-strip">
      <span class="vault-badge">VAULT-TEC<br>APPROVED READING</span>
      <span class="issue-info">ISSUE No. 001 — 発行月をここに</span>
    </header>

    <!-- タイトルロゴ -->
    <h1 class="masthead-title">
      <span class="title-sub">THE</span>
      <span class="title-main">タイトルをここに</span>
      <span class="title-sub2">SURVIVAL GUIDE</span>
    </h1>

    <!-- 見出しティーザー(左) + ポートレート(中央) -->
    <div class="cover-body">
      <div class="teaser-column">
        <div class="teaser teaser-yellow">
          <span class="teaser-head">見出し１をここに</span>
          <span class="teaser-sub">サブテキスト、一言添えると雑誌っぽくなる</span>
        </div>
        <div class="teaser teaser-plain">
          <span class="teaser-head">見出し２をここに</span>
          <span class="teaser-sub">サブテキスト</span>
        </div>
        <div class="teaser teaser-red">
          <span class="teaser-head">見出し３をここに</span>
          <span class="teaser-sub">サブテキスト</span>
        </div>
      </div>

      <div class="portrait-frame">
        <span class="portrait-label">PORTRAIT / ILLUSTRATION<br>ここに写真かイラストを挿入</span>
      </div>
    </div>

    <!-- 下部フッター見出し -->
    <div class="cover-footline">
      <span class="footline-tag">WASTELAND GOURMAND</span>
      <span class="footline-text">フッターの一言コピーをここに</span>
    </div>

    <!-- バーコード欄 -->
    <footer class="barcode-strip">
      <div class="barcode-graphic" aria-hidden="true"></div>
      <span class="barcode-number">ISSN 1337-7035</span>
    </footer>

  </article>
</div>

</body>
</html>
